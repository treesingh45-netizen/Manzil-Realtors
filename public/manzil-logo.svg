<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <!-- Rich metallic champagne gold gradient matching the uploaded logo -->
    <linearGradient id="goldMetallic" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#EED596"/>
      <stop offset="25%" stopColor="#F7E7BE"/>
      <stop offset="55%" stopColor="#C99F4A"/>
      <stop offset="85%" stopColor="#A87F2E"/>
      <stop offset="100%" stopColor="#875E19"/>
    </linearGradient>

    <!-- Linear metallic gradient for vertical spires -->
    <linearGradient id="goldVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FBF0D2"/>
      <stop offset="35%" stopColor="#DEB965"/>
      <stop offset="70%" stopColor="#AF842F"/>
      <stop offset="100%" stopColor="#7E5616"/>
    </linearGradient>

    <!-- Outer stroke gradient for extra dimensional polish -->
    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#9B7325"/>
      <stop offset="50%" stopColor="#FCEAC1"/>
      <stop offset="100%" stopColor="#B38933"/>
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark charcoal / black background matching the uploaded logo -->
  <rect width="1000" height="750" fill="#151412"/>

  <!-- Centered Skyline Calligraphy Logo Group (منازل - MANZIL) -->
  <g transform="translate(105, 52)" filter="url(#badgeShadow)">
    
    <!-- ========================================== -->
    <!-- LAYER 1: HEAVY WHITE OUTER CONTOUR BORDER -->
    <!-- ========================================== -->
    <g stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
      
      <!-- 1. Left Lower Foot & Stepped Building (Lam / Kaaf) -->
      <path d="M 40 480 L 255 480 L 255 375 L 210 375 L 180 345 L 180 435 L 40 435 Z"/>
      
      <!-- 2. Left Stepped Tower Ridge -->
      <path d="M 180 345 L 210 345 L 210 240 L 255 240 L 255 480"/>

      <!-- 3. Tall Central Skyscraper (Alif) -->
      <path d="M 285 520 L 285 65 C 285 50 295 40 310 40 L 460 40 C 475 40 485 50 485 65 L 485 520 Z"/>

      <!-- 4. Central Gabled Arch / Pavilion (Noon / Manzil Vault) -->
      <path d="M 345 520 L 345 220 L 440 145 L 535 220 L 535 520 Z"/>

      <!-- 5. Central Vertical Spire Tab -->
      <path d="M 440 145 L 440 230"/>

      <!-- 6. Bottom Tail (Zay downward angled tail) -->
      <path d="M 440 340 L 440 520 L 405 580 C 395 595 375 605 355 595 L 320 575 C 300 560 305 535 325 525 L 375 495 L 375 340"/>

      <!-- 7. Right Base Loop & Window (Meem) -->
      <path d="M 495 520 L 690 520 C 705 520 715 510 715 495 L 715 435 C 715 420 705 410 690 410 L 535 410 L 535 320 L 600 320 L 600 520"/>
      <!-- Square Cutout Window in Meem -->
      <rect x="635" y="445" width="40" height="40" stroke="#FFFFFF" stroke-width="20" fill="none"/>

      <!-- 8. Dots with White Border -->
      <circle cx="440" cy="285" r="28" fill="#FFFFFF"/>
      <circle cx="575" cy="365" r="26" fill="#FFFFFF"/>
    </g>

    <!-- ========================================== -->
    <!-- LAYER 2: RICH METALLIC GOLD FOREGROUND     -->
    <!-- ========================================== -->
    <g stroke="url(#goldMetallic)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
      
      <!-- 1. Left Lower Foot & Stepped Building -->
      <path d="M 40 480 L 255 480 L 255 375 L 210 375 L 180 345 L 180 435 L 40 435 Z"/>
      
      <!-- 2. Left Stepped Tower Ridge -->
      <path d="M 180 345 L 210 345 L 210 240 L 255 240 L 255 480"/>

      <!-- 3. Tall Central Skyscraper (Alif) -->
      <path d="M 285 520 L 285 65 C 285 50 295 40 310 40 L 460 40 C 475 40 485 50 485 65 L 485 520 Z" stroke="url(#goldVertical)"/>

      <!-- 4. Central Gabled Arch / Pavilion -->
      <path d="M 345 520 L 345 220 L 440 145 L 535 220 L 535 520 Z"/>

      <!-- 5. Central Vertical Spire Tab -->
      <path d="M 440 145 L 440 230" stroke="url(#goldVertical)" stroke-width="16"/>

      <!-- 6. Bottom Tail (Zay) -->
      <path d="M 440 340 L 440 520 L 405 580 C 395 595 375 605 355 595 L 320 575 C 300 560 305 535 325 525 L 375 495 L 375 340"/>

      <!-- 7. Right Base Loop & Window (Meem) -->
      <path d="M 495 520 L 690 520 C 705 520 715 510 715 495 L 715 435 C 715 420 705 410 690 410 L 535 410 L 535 320 L 600 320 L 600 520"/>
      <!-- Square Cutout Window in Meem -->
      <rect x="635" y="445" width="40" height="40" stroke="url(#goldMetallic)" stroke-width="11" fill="#151412"/>

      <!-- 8. Solid Metallic Gold Dots -->
      <circle cx="440" cy="285" r="20" fill="url(#goldMetallic)" stroke="none"/>
      <circle cx="575" cy="365" r="18" fill="url(#goldMetallic)" stroke="none"/>
    </g>
  </g>
</svg>
